[project]
name = "fieldbook"
version = "0.1.0"
description = "Lightweight toolkit for ML experimentation: versioned data, reproducible runs, experiment tracking, and cloud GPUs, with no servers to operate."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "hien vo", email = "hvo.getz@gmail.com" }]
requires-python = ">=3.11"
keywords = ["machine-learning", "mlops", "data-versioning", "reproducibility", "research", "experiment-tracking", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Compatible ranges here (CI tests the lowest of each); the exact set each release was tested
# with is published as constraints/<version>.txt (docs/releasing.md).
dependencies = [
    "fsspec>=2024.6.0",
    "packaging>=23",  # which lock entry is for the image's system
    "pyarrow>=17",
    "pydantic-settings>=2.6",
    "pylance>=13.0",  # files in the table: its blob layout (file format 2.2)
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "tomlkit>=0.12",  # `fieldbook config set` edits settings files, keeping comments
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/vo-h/fieldbook"
Documentation = "https://github.com/vo-h/fieldbook/blob/main/docs/guide.md"
Issues = "https://github.com/vo-h/fieldbook/issues"
Changelog = "https://github.com/vo-h/fieldbook/blob/main/CHANGELOG.md"

[project.scripts]
fieldbook = "fieldbook.cli:main"

[project.entry-points."mlflow.run_context_provider"]
fieldbook = "fieldbook.tracking.plugin:PlatformRunContext"

[project.optional-dependencies]
validate = [
    "pandas>=2.2",
    "pandera[io]>=0.31",  # checks written directly under a column in schema YAML
]
sql = [
    "duckdb>=1.2",  # CSV files combined by column name
]
tracking = [
    "mlflow>=3.9",  # earlier versions break with SQLAlchemy 2.1, which they allow
    "psycopg[binary]>=3.1.12",  # shared Postgres tracking database; 3.1.12: Python 3.12 wheels
    "nvidia-ml-py>=12",
    "psutil>=5.9",
]
s3 = [  # data in an AWS S3 bucket
    "s3fs>=2024.6.0",
]
aws = [  # cloud runs on AWS: S3, ECR, IAM roles, and SkyPilot (E3)
    "fieldbook[s3]",
    "botocore>=1.35.16",  # put_object's IfNoneMatch (conditional writes)
    "skypilot[aws]>=0.14",
]
runpod = [  # cloud runs on RunPod GPUs; images and data stay on AWS
    "fieldbook[aws]",
    "skypilot[runpod]>=0.14",
]
all = ["fieldbook[validate,sql,tracking,aws]"]

[dependency-groups]
dev = [
    "fieldbook[all,runpod]",  # every extra, by reference, so the list cannot drift (E5)
    "moto[server]>=5.0.20",  # its test server reports its port (bound to port 0)
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rf: name failing tests; -n auto: one worker per core; --strict-markers: a mistyped marker
# is an error (D6); importlib: test files in different folders may share a name.
addopts = "-rf -n auto --strict-markers --import-mode=importlib"
pythonpath = ["tests"]  # tests import shared helpers with `from helpers import ...`
markers = [
    "mlflow: runs real MLflow setup",
    "slow: starts real MLflow servers; skip with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "design"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
