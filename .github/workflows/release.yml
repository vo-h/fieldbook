# Build and publish a release to PyPI when a version tag (v0.1.0, ...) is pushed.
#
# Off by default: runs only when the repository variable RELEASE_ENABLED is "true".
# Publishing uses PyPI trusted publishing (no token stored in GitHub): before the first
# release, add this repository and workflow as a trusted publisher of the `fieldbook`
# project on pypi.org, with the environment name `pypi`. See docs/releasing.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:  # the full CI suite (lint, tests on every Python, constraints check) must pass first
    if: vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
